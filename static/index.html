<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headline Impact</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230D1B2A'/><path d='M6 22l6-7 5 4 9-11' stroke='%23E9B949' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>

<!-- Stock picker -->
<section id="landing" class="landing">
  <div class="brand"><span class="brand-mark"></span>Headline Impact</div>
  <div class="landing-body">
    <h1>Which stock do you want to observe?</h1>
    <p class="lede">Live price, every headline, and how the market actually reacted to each one.</p>
    <div class="search" id="search">
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search a company or symbol, e.g. HDFC Bank or INFY.NS" aria-label="Search stock">
      <ul id="searchResults" class="search-results" role="listbox" hidden></ul>
    </div>
    <div id="landingSv" class="landing-sv"></div>
    <div class="popular">
      <div class="popular-group">
        <span class="popular-label">India, NSE</span>
        <div class="chips" id="chipsIN"></div>
      </div>
      <div class="popular-group">
        <span class="popular-label">United States</span>
        <div class="chips" id="chipsUS"></div>
      </div>
    </div>
  </div>
  <footer class="landing-foot">
    <span id="aiStatusLanding" class="ai-status"></span>
    <button class="link-btn" data-open="sources">How the data is pulled</button>
  </footer>
</section>

<!-- Workspace -->
<section id="workspace" class="ws" hidden>
  <header class="topbar">
    <button class="brand brand-btn" id="homeBtn" title="Pick another stock"><span class="brand-mark"></span></button>
    <div class="ident">
      <div class="ident-name" id="identName">Loading</div>
      <div class="ident-meta" id="identMeta"></div>
    </div>
    <div class="ticker" id="ticker">
      <span class="ticker-price" id="tkPrice">–</span>
      <span class="ticker-chg" id="tkChg"></span>
      <span class="ticker-state" id="tkState"></span>
    </div>
    <div class="controls">
      <label>History
        <select id="selPeriod">
          <option value="1mo">1 month</option><option value="3mo">3 months</option>
          <option value="6mo" selected>6 months</option><option value="1y">1 year</option><option value="2y">2 years</option>
        </select>
      </label>
      <label>News
        <select id="selDays">
          <option value="7">7 days</option><option value="14">14 days</option>
          <option value="30" selected>30 days</option><option value="60">60 days</option><option value="90">90 days</option>
        </select>
      </label>
      <label>Refresh
        <select id="selInterval">
          <option value="5">5 s</option><option value="10" selected>10 s</option>
          <option value="30">30 s</option><option value="60">60 s</option><option value="0">Paused</option>
        </select>
      </label>
      <button class="btn ghost" data-open="sources">Data sources</button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Lenses"></nav>

  <main class="lens" id="lens" tabindex="-1"></main>
</section>

<!-- Data sources dialog -->
<dialog id="sources" class="dialog">
  <div class="dialog-head">
    <h2>How the data is pulled</h2>
    <button class="icon-btn" data-close aria-label="Close">✕</button>
  </div>
  <div class="dialog-body" id="sourcesBody"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
